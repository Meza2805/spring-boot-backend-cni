spring.application.name=firstexample
server.port=8081





# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS
# Descomenta el bloque del motor que quieras usar en clase.
# ===================================================================

# -------------------------------------------------------------------
# OPCIÓN 1: SQLITE (Activa por defecto para la primera prueba)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:sqlite:cni_db.db
# spring.datasource.driver-class-name=org.sqlite.JDBC
# spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# -------------------------------------------------------------------
# OPCIÓN 2: MYSQL (Descomenta estas 4 líneas para cambiar a MySQL)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/cni_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# CONFIGURACIÓN DE HIBERNATE / MIGRACIONES (Code-First)
# -------------------------------------------------------------------
# 'update' genera o actualiza automáticamente las tablas según las clases @Entity
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL ejecutadas por Hibernate en la consola de VS Code
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true